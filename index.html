<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Creator Prompt OS</title>
</head>

<body style="font-family: Arial; max-width: 600px; margin: 60px auto;">

  <h1>Creator Prompt OS</h1>
  <p>Generate high-converting AI prompts for creators.</p>

  <input 
    id="topic" 
    type="text" 
    placeholder="Enter a topic (e.g. productivity, fitness, marketing)"
    style="width:100%; padding:10px; font-size:16px;"
  />

  <button 
    id="generateBtn" 
    onclick="generatePrompt()" 
    style="margin-top:15px; padding:10px 20px; font-size:16px;"
  >
    Generate
  </button>

  <div 
    id="output" 
    style="white-space: pre-wrap; margin-top:25px; padding:15px; background:#f4f4f4;"
  >
  </div>

  <button 
    onclick="copyPrompt()" 
    style="margin-top:15px; padding:8px 16px;"
  >
    Copy Prompt
  </button>

  <script>
    async function generatePrompt() {
      const topicInput = document.getElementById("topic");
      const outputDiv = document.getElementById("output");
      const button = document.getElementById("generateBtn");

      const topic = topicInput.value.trim();

      if (!topic) {
        outputDiv.innerText = "Please enter a topic.";
        return;
      }

      button.disabled = true;
      button.innerText = "Generating...";
      outputDiv.innerText = "Generating prompt...";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ topic })
        });

        const data = await response.json();

        if (!response.ok) {
          outputDiv.innerText = data.error || "Something went wrong.";
        } else {
          outputDiv.innerText = data.result;
        }

      } catch (error) {
        outputDiv.innerText = "Server error. Please try again.";
      }

      button.disabled = false;
      button.innerText = "Generate";
    }

    function copyPrompt() {
      const text = document.getElementById("output").innerText;

      if (!text || text === "Generating prompt...") {
        alert("Nothing to copy yet.");
        return;
      }

      navigator.clipboard.writeText(text);
      alert("Prompt copied to clipboard!");
    }
  </script>

</body>
</html>
