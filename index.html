<!DOCTYPE html>
<html>
<head>
  <title>CreatorOS AI Thread Generator</title>
  <style>
    body {
      font-family: Arial;
      padding: 40px;
      background: #111;
      color: white;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      background: #00ff99;
      border: none;
      cursor: pointer;
    }
    #output {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #222;
      padding: 20px;
    }
  </style>
</head>
<body>

<h1>CreatorOS AI Thread Generator</h1>

<label>Enter Topic:</label>
<input id="topic" placeholder="Productivity for creators" />

<button onclick="generateThread()">Generate Thread</button>

<div id="output"></div>

<script>
async function generatePrompt() {
  const topicInput = document.getElementById("topic");
  const outputDiv = document.getElementById("output");
  const button = document.getElementById("generateBtn");

  const topic = topicInput.value.trim();

  if (!topic) {
    outputDiv.innerText = "Please enter a topic.";
    return;
  }

  button.disabled = true;
  button.innerText = "Generating...";
  outputDiv.innerText = "Generating prompt...";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ topic })
    });

    const data = await response.json();

    if (!response.ok) {
      outputDiv.innerText = data.error || "Something went wrong.";
    } else {
      outputDiv.innerText = data.result;
    }

  } catch (error) {
    outputDiv.innerText = "Server error. Try again.";
  }

  button.disabled = false;
  button.innerText = "Generate";
}

function copyPrompt() {
  const text = document.getElementById("output").innerText;

  if (!text || text === "Generating prompt...") {
    alert("Nothing to copy yet.");
    return;
  }

  navigator.clipboard.writeText(text);
  alert("Prompt copied to clipboard!");
}
</script>

</body>
</html>
